name: Publish/Upload dotnet package on release

# PLEASE NOTE: PUBLISHING/DEPLOYMENT
# Release is to be created manually at GitHub releases management page
# - release name usually contains "v1.2.3"
# After creating a GitHub release, following actions will automatically run:
# 1. NuGet package (version as defined in VS.Net project property "package version")
# 2. Attaching of compiled binaries to GitHub release

on:
  release:
    types: [created]

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

env:
  # Path to the solution file relative to the root of the project.
  SOLUTION_FILE_PATH: .

  # Name of project configuration for build as well as name of the bin output subdirectory (both must match for "dotnet pack" to find compiled files!)
  BUILD_CONFIGURATION: Release
  # Name of build project which creates required output for packaging/deployment
  BUILD_PROJECT: Ocs/CompuMaster.Ocs.csproj
  # Name of directory (e.g. "bin") containing the subdirectory (e.g. "CI_CD") with all output files (*.dll)
  BUILD_OUTPUT_BASEDIR: Ocs/bin
  RELEASE_VERSION: ${{ github.ref_name }}


jobs:
    publish:
        permissions:
          contents: write
          id-token: write
        if: github.event_name == 'release'
        runs-on: windows-latest
        #if: false # always skip job

        steps:
            # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup .NET Core
              uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
              with:
                dotnet-version: 8.0.x

            - name: Validate release version
              shell: pwsh
              run: |
                if ($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+(\.\d+)?$') {
                    throw 'The release tag must be a numeric NuGet version without a leading v.'
                }

            - name: Install dependencies
              run: dotnet restore

            - name: Build
              run: dotnet build --configuration=${{env.BUILD_CONFIGURATION}} --no-restore -p:Version=${{env.RELEASE_VERSION}}

            - name: Pack binaries CompuMaster.OpenCollaborationServices
              run: Compress-Archive -DestinationPath bin.zip ${{env.BUILD_OUTPUT_BASEDIR}}/${{env.BUILD_CONFIGURATION}}

            - name: Publish binaries CompuMaster.OpenCollaborationServices
              uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
              with:
                files: "bin.zip"
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Pack CompuMaster.OpenCollaborationServices
              run: dotnet pack --no-build --configuration=${{env.BUILD_CONFIGURATION}} ${{env.BUILD_PROJECT}} --output . -p:Version=${{env.RELEASE_VERSION}}

            - name: Authenticate to NuGet.org via Trusted Publishing
              uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
              id: nuget-login
              with:
                user: ${{ vars.NUGET_USER }}

            - name: PushNuget CompuMaster.OpenCollaborationServices
              env:
                NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
              run: dotnet nuget push *.nupkg --source https://api.nuget.org/v3/index.json --api-key "$env:NUGET_API_KEY" --skip-duplicate

            - name: Publish Package Artifacts
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                name: Nupkg Artifacts
                path: ./**/*.nupkg
